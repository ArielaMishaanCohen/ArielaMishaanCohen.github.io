<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 Predictor · Ariela Mishaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --g:#10b981;--g2:#059669;--g3:#065f46;--gL:#d1fae5;--gL2:#a7f3d0;
  --accent:#6366f1;--acL:#e0e7ff;
  --ink:#111827;--ink2:#374151;--ink3:#6b7280;--ink4:#9ca3af;
  --bg:#f3f4f6;--s0:#ffffff;--s1:#f9fafb;--s2:#f3f4f6;
  --red:#ef4444;--rL:#fee2e2;--gold:#d97706;--gld:#fef3c7;
  --amber:#f59e0b;--amL:#fef3c7;
  --line:rgba(0,0,0,0.06);--line2:rgba(0,0,0,0.1);
  --r:14px;--r2:10px;--r3:7px;
  --sh:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.05);
  --sh2:0 0 0 2px rgba(16,185,129,.2),0 4px 20px rgba(16,185,129,.12);
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh;}
h2{font-size:20px;font-weight:800;letter-spacing:-.4px;}

header{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#fff;position:sticky;top:0;z-index:60;box-shadow:0 4px 24px rgba(0,0,0,.35);}
.hbar{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;flex-direction:column;}
.brand-t{font-size:17px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;}
.brand-s{font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;opacity:.5;margin-top:2px;}
.hsp{flex:1;}
.chip{font-size:11px;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);}
.dot{width:6px;height:6px;border-radius:50%;background:#34d399;flex:none;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.resetbtn{font-size:11px;font-weight:700;color:rgba(255,255,255,.7);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:6px 14px;border-radius:7px;cursor:pointer;transition:.15s;}
.resetbtn:hover{background:rgba(255,255,255,.18);color:#fff;}
nav{background:rgba(0,0,0,.3);border-top:1px solid rgba(255,255,255,.06);}
.navbar{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;gap:0;overflow-x:auto;scrollbar-width:none;}
.navbar::-webkit-scrollbar{display:none;}
.tab{font-size:11px;font-weight:700;color:rgba(255,255,255,.45);padding:10px 16px 9px;border:none;background:none;cursor:pointer;position:relative;white-space:nowrap;letter-spacing:.8px;text-transform:uppercase;transition:.15s;}
.tab:hover{color:rgba(255,255,255,.85);}
.tab.on{color:#34d399;}
.tab.on::after{content:'';position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:2px 2px 0 0;background:#34d399;}

.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 80px;}
.view{animation:fadeUp .25s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead{margin:0 0 20px;}
.lead h2{font-size:28px;font-weight:900;letter-spacing:-.7px;}
.lead p{color:var(--ink3);font-size:13px;margin-top:6px;max-width:680px;line-height:1.65;}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-bottom:12px;}
.tag-g{background:var(--gL);color:var(--g3);}
.tag-p{background:var(--acL);color:var(--accent);}
.tag-a{background:var(--amL);color:var(--gold);}

/* MATCH CARDS */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:740px){.mgrid{grid-template-columns:1fr;}}
.mc{background:var(--s0);border:1px solid var(--line2);border-radius:10px;padding:16px 18px;box-shadow:var(--sh);transition:box-shadow .15s,border-color .15s,transform .1s;}
.mc:hover{box-shadow:var(--sh2);border-color:rgba(16,185,129,.3);transform:translateY(-1px);}
.mc.played{border-left:3px solid var(--g);background:linear-gradient(135deg,rgba(209,250,229,.4) 0%,var(--s0) 60%);}
.gtag{font-size:9px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:var(--ink4);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.mc.played .gtag{color:var(--g2);}
.played-badge{background:var(--gL);color:var(--g3);font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;}
.mteams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:12px;}
.mt{display:flex;flex-direction:column;gap:3px;}
.mt.away{align-items:flex-end;}
.mname{font-weight:800;font-size:13px;display:flex;align-items:center;gap:5px;}
.mt.away .mname{flex-direction:row-reverse;}
.melo{font-size:9px;font-weight:600;color:var(--ink4);letter-spacing:.5px;font-family:'JetBrains Mono',monospace;}
.sbadge{background:var(--s2);border:1.5px solid var(--line2);border-radius:7px;text-align:center;padding:8px 12px;min-width:68px;}
.mc.played .sbadge{background:var(--gL);border-color:rgba(16,185,129,.35);}
.sc{font-size:24px;font-weight:900;color:var(--ink3);line-height:1;font-family:'JetBrains Mono',monospace;letter-spacing:-.5px;}
.mc.played .sc{color:var(--g3);}
.slbl{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink4);margin-top:2px;}
.mc.played .slbl{color:var(--g2);}
.pbar{height:8px;border-radius:5px;overflow:hidden;display:flex;background:var(--s2);}
.pw{background:var(--g);transition:width .4s ease;}
.pd{background:#d1d5db;}
.pl{background:#fca5a5;}
.plbs{display:flex;justify-content:space-between;font-size:10px;font-weight:700;margin-top:5px;color:var(--ink3);}
.plbs b{color:var(--ink);font-weight:800;}
.ptrace{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.ptrace span{font-size:9px;font-weight:800;color:var(--ink3);background:var(--s1);border:1px solid var(--line);border-radius:5px;padding:3px 6px;}
.ptrace .adj{color:var(--accent);background:var(--acL);border-color:rgba(99,102,241,.18);}
.mact{display:flex;gap:6px;margin-top:12px;align-items:center;}
.sin{width:46px;background:var(--s1);border:1.5px solid var(--line2);border-radius:7px;color:var(--ink);font-size:20px;font-weight:800;text-align:center;padding:7px 0;outline:none;transition:.15s;font-family:'JetBrains Mono',monospace;-moz-appearance:textfield;}
.sin::-webkit-inner-spin-button,.sin::-webkit-outer-spin-button{-webkit-appearance:none;}
.sin:focus{border-color:var(--g);background:var(--s0);box-shadow:0 0 0 3px rgba(16,185,129,.15);}
.vs{color:var(--ink3);font-weight:800;font-size:13px;}
.msp{flex:1;}
.cbtn{font-size:11px;font-weight:700;color:var(--ink3);background:none;border:1.5px solid var(--line2);cursor:pointer;padding:7px 11px;border-radius:7px;transition:.15s;}
.cbtn:hover{border-color:var(--red);color:var(--red);}
.gbtn{font-size:12px;font-weight:800;color:#fff;background:var(--g);border:none;cursor:pointer;padding:8px 16px;border-radius:7px;transition:.15s;}
.gbtn:hover{background:var(--g2);}
.gbtn:active{transform:scale(.96);}

/* GROUPS */
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:900px){.ggrid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:540px){.ggrid{grid-template-columns:1fr;}}
.gcard{background:var(--s0);border:1px solid var(--line2);border-radius:10px;padding:14px 16px;box-shadow:var(--sh);}
.gcardh{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--g2);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.gcardh-right{font-weight:600;color:var(--ink4);font-size:9px;letter-spacing:.5px;}
.gheader{display:grid;grid-template-columns:20px 1fr 36px 56px;gap:6px;padding:0 6px 7px;margin-bottom:2px;border-bottom:2px solid var(--s2);}
.gheader span{font-size:8px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink4);}
.gheader span:nth-child(3),.gheader span:nth-child(4){text-align:right;}
.grow{display:grid;grid-template-columns:20px 1fr 36px 56px;gap:6px;align-items:center;padding:7px 6px;border-radius:8px;transition:background .1s;}
.grow:hover{background:var(--s1);}
.grow+.grow{border-top:1px solid var(--line);}
.gpos{font-weight:800;font-size:11px;color:var(--ink4);text-align:center;}
.grow.q1 .gpos{color:var(--g);}
.grow.q2 .gpos{color:var(--g2);}
.grow.q3 .gpos{color:var(--accent);}
.gnm{font-weight:700;font-size:12px;display:flex;align-items:center;gap:5px;overflow:hidden;}
.gnmt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gpts{font-weight:800;font-size:13px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--ink);}
.gadv{font-size:10px;font-weight:800;color:var(--ink4);text-align:right;font-family:'JetBrains Mono',monospace;}
.grow.q1 .gadv,.grow.q2 .gadv{color:var(--g2);}
.grow.q3 .gadv{color:var(--accent);}
.gnote{font-size:9px;color:var(--ink4);font-weight:600;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);}

/* BRACKET */
.bracket-scroll{overflow-x:auto;padding:4px 0 14px;scrollbar-width:thin;}
.bracket{display:flex;gap:10px;min-width:max-content;align-items:stretch;}
.bcol{display:flex;flex-direction:column;min-width:190px;max-width:200px;}
.bcol.sfcol{justify-content:space-around;}
.bcol.champcol{min-width:170px;justify-content:center;align-items:center;}
.brh{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--ink3);text-align:center;padding:6px 0 10px;}
.bspacer{flex:1;}
.tie{background:var(--s0);border:1px solid var(--line2);border-radius:7px;overflow:hidden;margin-bottom:7px;box-shadow:var(--sh);transition:border-color .15s;}
.tie:hover{border-color:rgba(16,185,129,.3);}
.bslot{display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer;transition:background .12s;border:1.5px solid transparent;border-radius:5px;font-size:12px;margin:2px;}
.bslot:hover{background:var(--s1);}
.bslot.win{background:var(--gL);border-color:rgba(16,185,129,.4);}
.bslot.real{background:var(--gL);border-color:var(--g);}
.bslot .bnm{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bslot .bwp{font-size:10px;font-weight:800;color:var(--ink4);font-family:'JetBrains Mono',monospace;}
.bslot.win .bwp,.bslot.real .bwp{color:var(--g2);}
.bslot .btbd{color:var(--ink4);font-style:italic;font-weight:600;font-size:11px;}
.bsc{text-align:center;font-size:9px;font-weight:800;color:var(--ink4);padding:4px 0 3px;border-top:1px solid var(--line);letter-spacing:.5px;font-family:'JetBrains Mono',monospace;}
.bsc.has{color:var(--g2);}
.trophy{background:linear-gradient(135deg,#fefce8,#fef3c7,#fde68a);border:1.5px solid rgba(217,119,6,.3);border-radius:14px;padding:24px 20px;text-align:center;min-width:155px;box-shadow:0 4px 20px rgba(217,119,6,.15);}
.trophy .tk{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:800;}
.trophy .tfl{font-size:40px;margin:10px 0 6px;line-height:1;}
.trophy .tnm{font-size:16px;font-weight:900;color:var(--ink);letter-spacing:-.3px;}
.trophy .tpc{font-size:12px;color:var(--gold);font-weight:800;margin-top:5px;font-family:'JetBrains Mono',monospace;}

/* FAVORITES */
.fhero{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
@media(max-width:700px){.fhero{grid-template-columns:1fr;}}
.champ-c{background:linear-gradient(135deg,var(--s0) 0%,var(--gL) 100%);border:1px solid rgba(16,185,129,.25);border-radius:14px;padding:26px;box-shadow:var(--sh);}
.champ-c .ck{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:800;}
.champ-nm{font-size:30px;font-weight:900;margin:8px 0 4px;display:flex;align-items:center;gap:10px;letter-spacing:-.6px;}
.champ-p{color:var(--ink3);font-size:13px;margin-top:5px;}
.champ-p b{color:var(--g3);font-size:20px;font-family:'JetBrains Mono',monospace;}
.champ-sub{color:var(--ink4);font-size:11px;margin-top:6px;font-weight:600;font-family:'JetBrains Mono',monospace;}
.flist,.fulllist{background:var(--s0);border:1px solid var(--line2);border-radius:14px;padding:8px 10px 12px;box-shadow:var(--sh);}
.frow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 8px;border-radius:9px;transition:.1s;}
.frow:hover{background:var(--s1);}
.frank{font-weight:800;font-size:12px;color:var(--ink4);text-align:center;font-family:'JetBrains Mono',monospace;}
.frow.t1 .frank{color:var(--gold);}
.frow.t2 .frank,.frow.t3 .frank{color:var(--ink2);}
.fnm{font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px;}
.fbar-bg{height:4px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:4px;}
.fbar-fill{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--g),var(--g2));}
.fmini{font-size:10px;color:var(--ink4);font-weight:600;margin-top:3px;font-family:'JetBrains Mono',monospace;}
.fval{font-weight:900;font-size:16px;text-align:right;font-family:'JetBrains Mono',monospace;}
.fval2{font-size:9px;color:var(--ink4);font-weight:600;text-align:right;text-transform:uppercase;letter-spacing:.5px;}

/* ACCURACY */
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
@media(max-width:800px){.acc-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.acc-grid{grid-template-columns:1fr 1fr;}}
.acc-stat{background:var(--s0);border:1px solid var(--line2);border-radius:12px;padding:18px 20px;box-shadow:var(--sh);}
.acc-stat .as-lbl{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink4);margin-bottom:6px;}
.acc-stat .as-val{font-size:32px;font-weight:900;font-family:'JetBrains Mono',monospace;color:var(--ink);line-height:1;}
.acc-stat .as-sub{font-size:11px;color:var(--ink3);margin-top:5px;font-weight:600;}
.acc-stat.hi .as-val{color:var(--g2);}
.acc-stat.med .as-val{color:var(--gold);}

.cal-section{background:var(--s0);border:1px solid var(--line2);border-radius:12px;padding:16px 18px;box-shadow:var(--sh);margin-bottom:16px;}
.cal-title{font-size:12px;font-weight:800;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.cal-title span{font-size:10px;font-weight:600;color:var(--ink4);font-family:'JetBrains Mono',monospace;background:var(--s2);padding:2px 8px;border-radius:5px;}
.cal-bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.cal-lbl{font-size:11px;font-weight:700;color:var(--ink3);width:40px;text-align:right;font-family:'JetBrains Mono',monospace;}
.cal-bar{flex:1;height:22px;border-radius:6px;background:var(--s2);position:relative;overflow:visible;}
.cal-fill{height:100%;border-radius:6px;transition:width .5s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;}
.cal-fill-g{background:linear-gradient(90deg,var(--g),var(--g2));}
.cal-fill-a{background:linear-gradient(90deg,var(--gold),#f59e0b);}
.cal-fill-r{background:linear-gradient(90deg,#f87171,var(--red));}
.cal-cnt{font-size:10px;font-weight:800;color:#fff;white-space:nowrap;}
.cal-pct{font-size:10px;font-weight:700;color:var(--ink3);width:36px;font-family:'JetBrains Mono',monospace;}

.match-list{display:flex;flex-direction:column;gap:4px;}
.ml-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;font-size:12px;transition:background .1s;}
.ml-row:hover{background:var(--s1);}
.ml-row.correct{border-left:3px solid var(--g);}
.ml-row.wrong{border-left:3px solid var(--red);}
.ml-teams{font-weight:700;color:var(--ink);}
.ml-score{font-family:'JetBrains Mono',monospace;font-weight:800;color:var(--ink3);text-align:center;}
.ml-prob{font-size:10px;color:var(--ink4);font-weight:600;text-align:right;font-family:'JetBrains Mono',monospace;}
.ml-badge{font-size:9px;font-weight:800;padding:2px 7px;border-radius:5px;text-align:center;}
.ml-badge.ok{background:var(--gL);color:var(--g3);}
.ml-badge.err{background:var(--rL);color:var(--red);}
.cal-legend{display:flex;gap:14px;font-size:11px;color:var(--ink3);font-weight:600;margin-top:8px;flex-wrap:wrap;}
.cal-legend span{display:inline-flex;align-items:center;gap:5px;}
.leg-dot{width:8px;height:8px;border-radius:50%;}

/* HOW */
.howcard{background:var(--s0);border:1px solid var(--line2);border-radius:14px;padding:20px 24px;box-shadow:var(--sh);}
.step{display:flex;gap:16px;align-items:flex-start;padding:14px 0;}
.step+.step{border-top:1px solid var(--line);}
.sn{font-weight:900;font-size:12px;width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--gL);color:var(--g2);}
.step-t{font-weight:800;font-size:13px;color:var(--ink);margin-bottom:4px;}
.step-d{color:var(--ink3);font-size:12px;line-height:1.65;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(16px);background:#111827;color:#fff;font-weight:700;font-size:12px;padding:11px 20px;border-radius:14px;opacity:0;transition:.22s;z-index:99;pointer-events:none;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.35);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.legend{display:flex;gap:16px;font-size:11px;color:var(--ink3);font-weight:600;margin-top:10px;flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.lsw{width:11px;height:11px;border-radius:3px;}
.grp-header{margin-bottom:6px;margin-top:20px;display:flex;align-items:center;gap:10px;}
.grp-label{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--ink3);}
.grp-line{flex:1;height:1px;background:var(--line2);}
.flag{height:1em;width:1.5em;object-fit:cover;border-radius:2px;vertical-align:-0.16em;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.18);background:var(--s1);}
</style>

<header>
  <div class="hbar">
    <div class="brand">
      <div class="brand-t">&#x26BD; Quiniela Mundial 2026</div>
      <div class="brand-s">v9 &middot; Modelo propio &middot; Monte Carlo &middot; Bracket FIFA</div>
    </div>
    <div class="hsp"></div>
    <div class="chip"><span class="dot"></span><span id="saveTxt">Guardado</span></div>
    <button class="resetbtn" id="resetBtn">&#8635; Reiniciar</button>
  </div>
  <nav><div class="navbar" id="nav"></div></nav>
</header>
<div class="wrap"><div id="app"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

const GROUPS={
  "A":["Mexico","South Africa","Korea Republic","Czechia"],
  "B":["Canada","Bosnia and Herzegovina","Qatar","Switzerland"],
  "C":["Haiti","Scotland","Brazil","Morocco"],
  "D":["USA","Paraguay","Australia","T\u00fcrkiye"],
  "E":["C\u00f4te d'Ivoire","Ecuador","Germany","Cura\u00e7ao"],
  "F":["Netherlands","Japan","Sweden","Tunisia"],
  "G":["IR Iran","New Zealand","Belgium","Egypt"],
  "H":["Saudi Arabia","Uruguay","Spain","Cabo Verde"],
  "I":["France","Senegal","Iraq","Norway"],
  "J":["Argentina","Algeria","Austria","Jordan"],
  "K":["Portugal","Congo DR","Uzbekistan","Colombia"],
  "L":["Ghana","Panama","England","Croatia"]
};

const TG={};Object.entries(GROUPS).forEach(([g,ts])=>ts.forEach(t=>TG[t]=g));

// Asigna cada slot "Best 3rd" usando la tabla oficial FIFA (Annex C, 495 combinaciones).
// Con fallback a backtracking para las ~35 combinaciones no incluidas en la tabla.
function matchThirds(availGroups){
  const sig=[...availGroups].sort().join("");
  if(_thirdMemo[sig])return _thirdMemo[sig];
  const assign={};
  if(FIFA3RD[sig]){
    // Lookup oficial: vals[i] corresponde a FIFA3RD_KEYS[i]
    const vals=FIFA3RD[sig];
    FIFA3RD_KEYS.forEach((k,i)=>{assign[k]=vals[i]||null;});
    _thirdMemo[sig]=assign;return assign;
  }
  // Fallback backtracking (combinaciones no cubiertas por la tabla)
  const avail=new Set(availGroups);
  const order=[...BEST3_SLOTS].sort((a,b)=>
    a.groups.filter(g=>avail.has(g)).length-b.groups.filter(g=>avail.has(g)).length);
  const used=new Set(),partial=avail.size<order.length;
  (function bt(i){
    if(i===order.length)return true;
    const s=order[i];
    for(const g of s.groups){
      if(avail.has(g)&&!used.has(g)){
        used.add(g);assign[s.key]=g;
        if(bt(i+1))return true;
        used.delete(g);delete assign[s.key];
      }
    }
    if(partial){assign[s.key]=null;if(bt(i+1))return true;delete assign[s.key];}
    return false;
  })(0);
  _thirdMemo[sig]=assign;return assign;
}

function probFromCache(cache,a,b,source){
  const k1=`${a}|${b}`,k2=`${b}|${a}`;
  if(cache[k1])return{p:cache[k1].slice(),source};
  if(cache[k2]){const p=cache[k2];return{p:[p[2],p[1],p[0]],source:`${source} invertido`};}
  return null;
}
function getProbBaseInfo(a,b,isKO=false){

  const second=isKO?probFromCache(SP_GS,a,b,"CSV grupos"):probFromCache(MC_CACHE,a,b,"match_proba_cache");
  return first||second||{p:eloProb(baseElo(a),baseElo(b)),source:"ELO fallback"};
}
function getProbBase(a,b,isKO=false){
  return getProbBaseInfo(a,b,isKO).p;

// Desplaza una terna [pa,pd,pb] según una diferencia de ELO (mantiene fijo el empate).
function shiftProbs(p,dElo){
  if(!dElo)return p.slice();
  const pd=p[1],rem=1-pd,den=(p[0]+p[2])||1,share=Math.min(0.999,Math.max(0.001,p[0]/den));
  const logit=Math.log(share/(1-share))+dElo/S;
  const r=1/(1+Math.exp(-logit));
  return[rem*r,pd,rem*(1-r)];
}

}
function getProb(a,b,isKO=false){
  return getProbInfo(a,b,isKO).p;
}

function goalLambdas(a,b){
  const la=TL[a]||[1.3,1.3],lb=TL[b]||[1.3,1.3];
  return[la[0]*0.5+lb[1]*0.35+0.15,lb[0]*0.5+la[1]*0.35+0.15];
}
function groupScore(a,b){
  const k=`${a}|${b}`,k2=`${b}|${a}`;
  if(GS_SCORE[k])return GS_SCORE[k].slice();
  if(GS_SCORE[k2]){const s=GS_SCORE[k2];return[s[1],s[0]];}
  return null;
}
function predGoals(a,b,isKO=false){
  const gs=isKO?null:groupScore(a,b);
  if(gs)return gs;
  const[la,lb]=goalLambdas(a,b);
  return[Math.max(0,Math.round(la)),Math.max(0,Math.round(lb))];
}
function predScore(a,b,isKO=false){
  const pinfo=getProbInfo(a,b,isKO);
  const[pa,pd,pb]=pinfo.p;
  let[ga,gb]=predGoals(a,b,isKO);
  if(!isKO&&groupScore(a,b)&&!pinfo.dAdj)return[ga,gb];
  if(pa>pb&&pa>=pd&&ga<=gb)ga=gb+1;
  else if(pb>pa&&pb>=pd&&gb<=ga)gb=ga+1;
  else if(pd>=pa&&pd>=pb){
    if(isKO){// En KO no puede haber empate: gana el que tiene mayor prob 1X2
      if(pa>=pb){const m=Math.max(ga,gb,0);ga=m+1;gb=m;}
      else{const m=Math.max(ga,gb,0);gb=m+1;ga=m;}
    }else{const m=Math.max(ga,gb,1);ga=gb=m;}
  }
  // Seguridad extra para KO: asegurar ga !== gb
  if(isKO&&ga===gb){if(pa>=pb)ga++;else gb++;}
  return[ga,gb];
}
function applyElo(a,b,ga,gb){
  const exp=eloProb(effElo(a),effElo(b)),sA=ga>gb?1:(ga<gb?0:0.5);
  const mg=1+Math.log(1+Math.abs(ga-gb))*0.6;
  const delta=26*mg*(sA-(exp[0]+exp[1]/2));
  elaAdj[a]=(elaAdj[a]||0)+delta;
  elaAdj[b]=(elaAdj[b]||0)-delta;
}
function recomputeElo(){
  elaAdj={};
  for(const fx of FIXTURES){const r=ST.gr[fx.k];if(r)applyElo(fx.a,fx.b,r[0],r[1]);}
}
function groupTable(g){
  const teams=GROUPS[g],row={};
  teams.forEach(t=>row[t]={t,Pts:0,GD:0,GF:0,played:0});
  for(const fx of FIXTURES){
    if(fx.g!==g)continue;
    const r=ST.gr[fx.k];if(!r)continue;
    const[ga,gb]=r,A=row[fx.a],B=row[fx.b];
    A.played++;B.played++;A.GF+=ga;A.GD+=ga-gb;B.GF+=gb;B.GD+=gb-ga;
    if(ga>gb)A.Pts+=3;else if(ga<gb)B.Pts+=3;else{A.Pts++;B.Pts++;}
  }
  return teams.map(t=>row[t]);
}
function makeProj(){
  const gkeys=Object.keys(GROUPS),tables={},W={},R={},thirds=[];
  for(const g of gkeys){
    const teams=GROUPS[g],row={};
    teams.forEach(t=>row[t]={Pts:0,GD:0,GF:0});
    for(const fx of FIXTURES){
      if(fx.g!==g)continue;
      const real=ST.gr[fx.k]||GS_REAL[fx.k]; // usa resultados reales aunque no estén en ST.gr
      if(real){
        const[ga,gb]=real;
        row[fx.a].Pts+=ga>gb?3:(ga===gb?1:0);row[fx.b].Pts+=gb>ga?3:(gb===ga?1:0);
        row[fx.a].GD+=ga-gb;row[fx.b].GD+=gb-ga;row[fx.a].GF+=ga;row[fx.b].GF+=gb;
      }else{
        const[pa,pd,pb]=getProb(fx.a,fx.b,false);
        row[fx.a].Pts+=pa*3+pd;row[fx.b].Pts+=pb*3+pd;
        const[sa,sb]=predScore(fx.a,fx.b);
        row[fx.a].GD+=sa-sb;row[fx.b].GD+=sb-sa;row[fx.a].GF+=sa;row[fx.b].GF+=sb;
      }
    }
    const ranked=teams.map(t=>(({t,...row[t]}))).sort((x,y)=>y.Pts-x.Pts||y.GD-x.GD||y.GF-x.GF||effElo(y.t)-effElo(x.t));
    tables[g]=ranked;W[g]=ranked[0].t;R[g]=ranked[1].t;
    thirds.push({g,t:ranked[2].t,Pts:ranked[2].Pts,GD:ranked[2].GD});
  }
  thirds.sort((x,y)=>y.Pts-x.Pts||y.GD-x.GD||effElo(y.t)-effElo(x.t));
  const best=thirds.slice(0,8),B={};best.forEach(b=>B[b.g]=b.t);
  const assign=matchThirds(best.map(b=>b.g));
  function slotTeam(s){
    if(s.startsWith("Winner Group "))return W[s.slice(13)]||"TBD";
    if(s.startsWith("Runner-up Group "))return R[s.slice(16)]||"TBD";
    if(s.startsWith("Best 3rd ")){const g=assign[s];return g&&B[g]?B[g]:"TBD";}
    return"TBD";
  }
  function win(a,b){
    if(!a||a==="TBD")return b||"TBD";if(!b||b==="TBD")return a;
    const rk=kk(a,b);if(ST.ko[rk])return ST.ko[rk];
    const[pa,,pb]=getProb(a,b,true);return pa>=pb?a:b;
  }
  const teamsAt={},winner={};
  for(const m of FIFA_R32){teamsAt[m.id]=[slotTeam(m.home),slotTeam(m.away)];winner[m.id]=win(teamsAt[m.id][0],teamsAt[m.id][1]);}
  [...R16_ORDER,...QF_ORDER,...SF_ORDER,FINAL_ID].forEach(id=>{
    const[f1,f2]=KO_FEED[id],a=winner[f1]||"TBD",b=winner[f2]||"TBD";
    teamsAt[id]=[a,b];winner[id]=win(a,b);
  });
  return{tables,W,R,teamsAt,winner,champion:winner[FINAL_ID]||"TBD",assign};
}
const pois=l=>{let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;};
const kk=(a,b)=>[a,b].sort().join("\u2295");
function forceOutcome(ga,gb,outcome){
  if(outcome==="home"&&ga<=gb)return[gb+1,gb];
  if(outcome==="away"&&gb<=ga)return[ga,ga+1];
  if(outcome==="draw"&&ga!==gb){const m=Math.max(ga,gb,1);return[m,m];}
  return[ga,gb];
}
function sampleOutcome(pa,pd,pb){
  const u=Math.random();
  if(u<pa)return"home";
  if(u<pa+pd)return"draw";
  return"away";
}

function runMC(N=5000){
  _thirdMemo={};
  const reach={};
  ALL_TEAMS.forEach(t=>reach[t]={qual:0,r16:0,qf:0,sf:0,fin:0,ch:0});
  for(let s=0;s<N;s++){
    const W={},R={},thirds=[];
    for(const g of Object.keys(GROUPS)){
      const teams=GROUPS[g],row={};
      teams.forEach(t=>row[t]={Pts:0,GD:0,GF:0,r:Math.random()});
      for(const fx of FIXTURES){
        if(fx.g!==g)continue;
        const real=ST.gr[fx.k]||GS_REAL[fx.k]; // fase de grupos ya conocida
        let ga,gb;
        if(real){[ga,gb]=real;}
        else{
          const[la,lb]=goalLambdas(fx.a,fx.b);
          ga=pois(la);gb=pois(lb);
          const[pa,pd,pb]=getProb(fx.a,fx.b,false);
          [ga,gb]=forceOutcome(ga,gb,sampleOutcome(pa,pd,pb));
        }
        row[fx.a].GF+=ga;row[fx.b].GF+=gb;row[fx.a].GD+=ga-gb;row[fx.b].GD+=gb-ga;
        if(ga>gb)row[fx.a].Pts+=3;else if(ga<gb)row[fx.b].Pts+=3;else{row[fx.a].Pts++;row[fx.b].Pts++;}
      }
      // KEY FIX: include team name in row object when sorting
      const rk=teams.map(t=>(({t,...row[t]})))
                    .sort((x,y)=>y.Pts-x.Pts||y.GD-x.GD||y.GF-x.GF||y.r-x.r);
      W[g]=rk[0].t;R[g]=rk[1].t;
      thirds.push({t:rk[2].t,Pts:rk[2].Pts,GD:rk[2].GD,r:rk[2].r,g});
    }
    thirds.sort((x,y)=>y.Pts-x.Pts||y.GD-x.GD||y.r-x.r);
    const best=thirds.slice(0,8),B={};best.forEach(b=>B[b.g]=b.t);
    const assign=matchThirds(best.map(b=>b.g));
    function sl(s){
      if(s.startsWith("Winner Group "))return W[s.slice(13)]||null;
      if(s.startsWith("Runner-up Group "))return R[s.slice(16)]||null;
      if(s.startsWith("Best 3rd ")){const g=assign[s];return g?B[g]:null;}
      return null;
    }
    function koW(a,b){
      if(!a)return b||null;if(!b)return a;
      const rk=kk(a,b);if(ST.ko[rk])return ST.ko[rk];
      const[pa,,pb]=getProb(a,b,true),tot=pa+pb||1;return Math.random()<pa/tot?a:b;
    }
    const winner={};
    // Round of 32: cada clasificado aparece en EXACTAMENTE un slot → qual ≤ 100%
    for(const m of FIFA_R32){
      const x=sl(m.home),y=sl(m.away);
      if(x&&reach[x])reach[x].qual++;
      if(y&&reach[y])reach[y].qual++;
      winner[m.id]=koW(x,y);
    }
    R16_ORDER.forEach(id=>{const[f1,f2]=KO_FEED[id];const w=koW(winner[f1],winner[f2]);winner[id]=w;if(w&&reach[w])reach[w].r16++;});
    QF_ORDER.forEach(id=>{const[f1,f2]=KO_FEED[id];const w=koW(winner[f1],winner[f2]);winner[id]=w;if(w&&reach[w])reach[w].qf++;});
    SF_ORDER.forEach(id=>{const[f1,f2]=KO_FEED[id];const w=koW(winner[f1],winner[f2]);winner[id]=w;});
    SF_ORDER.forEach(id=>{const w=winner[id];if(w&&reach[w])reach[w].fin++;}); // finalistas
    const finW=koW(winner[101],winner[102]);if(finW&&reach[finW])reach[finW].ch++;
  }
  const out={};
  ALL_TEAMS.forEach(t=>{
    const r=reach[t];
    out[t]={qual:r.qual/N,r16:r.r16/N,qf:r.qf/N,sf:r.sf/N,fin:r.fin/N,ch:r.ch/N};
  });
  return out;
}

    <div class="tfl">${ch!=="TBD"?fl(ch):"\uD83C\uDFC6"}</div>

    </div></div>`;
  html+=`</div>`;
  document.getElementById("app").innerHTML=`<div class="view">

    <div style="background:var(--s0);border:1px solid var(--line2);border-radius:14px;padding:16px;box-shadow:var(--sh);">
      <div class="bracket-scroll">${html}</div>
      <p style="font-size:10px;color:var(--ink4);font-weight:600;margin-top:8px;">% = probabilidad de ganar ese cruce (modelo) &middot; pred = marcador Poisson &middot; toca un equipo para fijar/liberar el ganador</p>

  const arr=ALL_TEAMS.map(t=>(({t,...(mc[t]||{ch:0,fin:0,sf:0,qf:0,r16:0,qual:0})})))
    .sort((a,b)=>b.ch-a.ch);
  const top=arr[0],maxch=top.ch||0.01;
  document.getElementById("app").innerHTML=`<div class="view">
    <div class="lead"><div class="tag tag-g">${mcSims.toLocaleString()} simulaciones &middot; Monte Carlo</div><h2>Favoritos al título</h2>
    <p>Probabilidad de campeón usando resultados reales de fase de grupos y cruces del bracket. La fase de grupos ya está completa.</p>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
      <button onclick="recalcMC()" class="gbtn">⟳ Recalcular (10 000 sim.)</button>
    </div></div>
    <div class="fhero">
      <div class="champ-c"><div class="ck">&#x2605; M\u00e1ximo favorito</div>
        <div class="champ-nm">${fl(top.t)} ${es(top.t)}</div>
        <div class="champ-p"><b>${p1(top.ch)}</b> de ser campe\u00f3n</div>
        <p class="champ-sub">Final: ${p0(top.fin)} &middot; Semis: ${p0(top.sf)} &middot; Cuartos: ${p0(top.qf)}</p>
      </div>
      <div class="flist">${arr.slice(0,6).map((r,i)=>`<div class="frow ${["t1","t2","t3"][i]||""}">
          <div class="frank">${i+1}</div>
          <div><div class="fnm">${fl(r.t)} ${es(r.t)}</div>
            <div class="fbar-bg"><span class="fbar-fill" style="width:${r.ch/maxch*100}%"></span></div>
          </div><div class="fval">${p1(r.ch)}</div>
        </div>`).join("")}</div>
    </div>
    <div class="fulllist">${arr.filter(r=>r.ch>0.0001).map((r,i)=>`<div class="frow ${["t1","t2","t3"][i]||""}">
        <div class="frank">${i+1}</div>
        <div><div class="fnm">${fl(r.t)} ${es(r.t)}</div>
          <div class="fbar-bg"><span class="fbar-fill" style="width:${Math.max(2,r.ch/maxch*100)}%"></span></div>
          <div class="fmini">Final ${p0(r.fin)} &middot; Semis ${p0(r.sf)} &middot; Cuartos ${p0(r.qf)} &middot; Clasif. ${p0(r.qual)}</div>
        </div>
        <div><div class="fval">${p1(r.ch)}</div><div class="fval2">campe\u00f3n</div></div>
      </div>`).join("")}</div>
  </div>`;
}

// ── ACCURACY ──
function renderA(){
  // Accuracy EN VIVO: partidos de grupos que ingresaste + cruces de bracket que fijaste,
  // evaluados contra la probabilidad BASE del modelo (sin fuga de datos).
  // Usa GS_REAL como fallback para mostrar todos los 48 partidos (fase de grupos completa)
  const gp=FIXTURES.filter(fx=>ST.gr[fx.k]||GS_REAL[fx.k]).map(fx=>{
    const[ga,gb]=ST.gr[fx.k]||GS_REAL[fx.k];
    const[pa,pd,pb]=getProbBase(fx.a,fx.b,false);
    const outcome=ga>gb?"home":(ga<gb?"away":"draw");
    // Pred FIJO del modelo: RREF_MAP para outcome, PRED_GS para marcador (no cambia con ELO)
    const _ref=RREF_MAP[`${fx.a}|${fx.b}`];
    const _predSc=PRED_GS[`${fx.a}|${fx.b}`]||null;
    const predGa=_predSc?_predSc[0]:null,predGb=_predSc?_predSc[1]:null;
    const pred=_ref?_ref.pred:(_predSc?(predGa>predGb?"home":(predGa<predGb?"away":"draw")):((pa>=pd&&pa>=pb)?"home":((pb>=pd&&pb>=pa)?"away":"draw")));
    const yH=outcome==="home"?1:0,yD=outcome==="draw"?1:0,yA=outcome==="away"?1:0;
    const brier=(pa-yH)**2+(pd-yD)**2+(pb-yA)**2;
    const pAct=outcome==="home"?pa:(outcome==="draw"?pd:pb);
    // "correct" se basa en el marcador predicho (goles_A/goles_B del CSV), no en la columna resultado
    const predOutcome=predGa!=null?(predGa>predGb?"home":predGa<predGb?"away":"draw"):pred;
    return{phase:"G",a:fx.a,b:fx.b,ga,gb,predGa,predGb,pa,pd,pb,outcome,pred,correct:predOutcome===outcome,brier,ll:-Math.log(Math.max(pAct,1e-9))};
  });
  // Bracket: cada cruce fijado es binario (sin empate)
  const ko=Object.keys(ST.ko).map(k=>{
    const parts=k.split("\u2295");if(parts.length!==2)return null;
    const t1=parts[0],t2=parts[1],w=ST.ko[k];if(w!==t1&&w!==t2)return null;
    const pr=getProbBase(t1,t2,true),tot=(pr[0]+pr[2])||1,p1=pr[0]/tot;
    const correct=(p1>=0.5)===(w===t1);
    const pAct=w===t1?p1:1-p1,y1=w===t1?1:0;
    return{phase:"K",a:t1,b:t2,w,p1,correct,brier:(p1-y1)**2+((1-p1)-(1-y1))**2,ll:-Math.log(Math.max(pAct,1e-9))};
  }).filter(Boolean);
  const all=gp.concat(ko),nAll=all.length,n=gp.length;
  const exactScore=gp.filter(m=>m.predGa!=null&&m.predGa===m.ga&&m.predGb===m.gb).length;
  const koCorrect=ko.filter(m=>m.correct).length;
  if(nAll===0){
    document.getElementById("app").innerHTML=`<div class="view">
      <div class="lead"><div class="tag tag-a">Se actualiza con tus resultados</div>
      <h2>Accuracy del modelo</h2>
      <p>Aquí verás qué tan bien le atina el modelo, calculado <b>en vivo</b> con los resultados reales que vayas ingresando.</p></div>
      <div style="background:var(--s0);border:1px solid var(--line2);border-radius:14px;padding:40px 20px;text-align:center;box-shadow:var(--sh);">
        <div style="font-size:34px;margin-bottom:8px;">📊</div>
        <p style="color:var(--ink3);font-weight:600;max-width:440px;margin:0 auto;">Todavía no has ingresado resultados. Anda a <b>Quiniela</b> y escribe los marcadores de la fase de grupos (y fija ganadores en el <b>Bracket</b>): aquí se irá calculando accuracy, Brier, log-loss y calibración partido por partido.</p>
      </div></div>`;
    return;
  }
  const correctAll=all.filter(m=>m.correct).length;
  const brier=all.reduce((s,m)=>s+m.brier,0)/nAll;
  const ll=all.reduce((s,m)=>s+m.ll,0)/nAll;
  // Per-resultado y calibración: solo fase de grupos (3 vías)
  const bktLabels=["0-20%","20-40%","40-60%","60-80%","80-100%"];
  const buckets={};bktLabels.forEach(l=>buckets[l]={pred:0,actual:0,n:0});
  gp.forEach(m=>{
    [{p:m.pa,hit:m.outcome==="home"},{p:m.pd,hit:m.outcome==="draw"},{p:m.pb,hit:m.outcome==="away"}].forEach(({p,hit})=>{
      const idx=Math.min(4,Math.floor(p*5)),lbl=bktLabels[idx];
      buckets[lbl].pred+=p;buckets[lbl].actual+=hit?1:0;buckets[lbl].n++;
    });
  });
  const cnt=o=>gp.filter(m=>m.outcome===o).length,cor=o=>gp.filter(m=>m.correct&&m.outcome===o).length;
  const homeG=cnt("home"),drawG=cnt("draw"),awayG=cnt("away");
  const homeC=cor("home"),drawC=cor("draw"),awayC=cor("away");
  const calRows=bktLabels.map(l=>{
    const b=buckets[l];if(b.n===0)return"";
    const predPct=b.pred/b.n*100,actPct=b.actual/b.n*100;
    return`<div style="margin-bottom:10px">
      <div style="font-size:10px;font-weight:800;color:var(--ink3);margin-bottom:4px;letter-spacing:.5px;">Predicho: ${l} &middot; n=${b.n}</div>
      <div class="cal-bar-wrap"><div class="cal-lbl">Pred.</div>
        <div class="cal-bar"><div class="cal-fill cal-fill-a" style="width:${predPct}%"><span class="cal-cnt">${predPct.toFixed(0)}%</span></div></div><div class="cal-pct">&nbsp;</div></div>
      <div class="cal-bar-wrap"><div class="cal-lbl">Real</div>
        <div class="cal-bar"><div class="cal-fill ${actPct>=predPct-8&&actPct<=predPct+8?"cal-fill-g":(actPct<predPct?"cal-fill-r":"cal-fill-a")}" style="width:${actPct}%"><span class="cal-cnt">${actPct.toFixed(0)}%</span></div></div><div class="cal-pct">&nbsp;</div></div>
    </div>`;
  }).join("");
  const exactMatchRows=gp.filter(m=>m.predGa!=null&&m.predGa===m.ga&&m.predGb===m.gb)
    .map(m=>`<div class="ml-row correct" style="border-left:3px solid var(--gold);">
      <div class="ml-badge" style="background:var(--gld);color:var(--gold);">⭐</div>
      <div class="ml-teams">${es(m.a)} vs ${es(m.b)}</div>
      <div class="ml-prob">${p0(m.pa)}/${p0(m.pd)}/${p0(m.pb)}</div>
      <div class="ml-score" style="font-size:10px;color:var(--gold);">${m.predGa}&ndash;${m.predGb} ✓ exacto</div>
    </div>`).join("");
  const matchRows=all.slice().reverse().map(m=>{
    if(m.phase==="K"){
      const correct=m.correct;
      return`<div class="ml-row ${correct?"correct":"wrong"}">
        <div class="ml-badge ${correct?"ok":"err"}">${correct?"\u2713":"\u2717"}</div>
        <div class="ml-teams">${es(m.a)} &rarr; <b>${es(m.w)}</b> <span style="color:var(--ink4);font-weight:700;">&middot; bracket</span></div>
        <div class="ml-prob">${p0(m.p1)}/${p0(1-m.p1)}</div>
        <div class="ml-score" style="font-size:10px;color:${correct?"var(--g2)":"var(--red)"};">KO</div>
      </div>`;
    }
    const predScLbl=m.predGa!=null?`${m.predGa}&ndash;${m.predGb}`:(m.pred==="home"?"L":(m.pred==="draw"?"X":"V"));
    const realScLbl=`${m.ga}&ndash;${m.gb}`;
    return`<div class="ml-row ${m.correct?"correct":"wrong"}">
      <div class="ml-badge ${m.correct?"ok":"err"}">${m.correct?"\u2713":"\u2717"}</div>
      <div class="ml-teams">${es(m.a)} vs ${es(m.b)}</div>
      <div class="ml-prob">${p0(m.pa)}/${p0(m.pd)}/${p0(m.pb)}</div>
      <div class="ml-score" style="font-size:10px;color:${m.correct?"var(--g2)":"var(--red)"};">pred ${predScLbl} &#x2192; real ${realScLbl}</div>
    </div>`;
  }).join("");
  document.getElementById("app").innerHTML=`<div class="view">
    <div class="lead">
      <div class="tag tag-a">${n} grupos${ko.length?` + ${ko.length} bracket`:""} &middot; se actualiza solo</div>
      <h2>Accuracy del modelo</h2>
      <p>Calculado en vivo con tus resultados reales, comparados con la probabilidad previa del modelo.</p>
    </div>
    <div class="acc-grid">
      <div class="acc-stat hi"><div class="as-lbl">Accuracy global</div><div class="as-val">${(correctAll/nAll*100).toFixed(1)}%</div><div class="as-sub">${correctAll}/${nAll} · grupos+bracket</div></div>
      <div class="acc-stat hi" style="border-left:3px solid var(--gold)"><div class="as-lbl">Marcador exacto</div><div class="as-val">${exactScore}</div><div class="as-sub">${n} grupos · ${(exactScore/Math.max(n,1)*100).toFixed(0)}% tasa</div></div>
      <div class="acc-stat med"><div class="as-lbl">Brier Score</div><div class="as-val">${brier.toFixed(3)}</div><div class="as-sub">Más bajo = mejor</div></div>
      <div class="acc-stat med"><div class="as-lbl">Log Loss</div><div class="as-val">${ll.toFixed(3)}</div><div class="as-sub">Más bajo = mejor</div></div>
      <div class="acc-stat"><div class="as-lbl">Partidos</div><div class="as-val">${nAll}</div><div class="as-sub">Grupos:${n} · Bracket:${ko.length}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
      <div class="cal-section">
        <div class="cal-title">Accuracy por resultado (grupos) <span>L=${(homeC/Math.max(homeG,1)*100).toFixed(0)}% X=${(drawC/Math.max(drawG,1)*100).toFixed(0)}% V=${(awayC/Math.max(awayG,1)*100).toFixed(0)}%</span></div>
        <div class="cal-bar-wrap"><div class="cal-lbl">Local</div><div class="cal-bar"><div class="cal-fill cal-fill-g" style="width:${homeC/Math.max(homeG,1)*100}%"><span class="cal-cnt">${homeC}/${homeG}</span></div></div><div class="cal-pct">${(homeC/Math.max(homeG,1)*100).toFixed(0)}%</div></div>
        <div class="cal-bar-wrap"><div class="cal-lbl">Empate</div><div class="cal-bar"><div class="cal-fill cal-fill-a" style="width:${drawC/Math.max(drawG,1)*100}%"><span class="cal-cnt">${drawC}/${drawG}</span></div></div><div class="cal-pct">${(drawC/Math.max(drawG,1)*100).toFixed(0)}%</div></div>
        <div class="cal-bar-wrap"><div class="cal-lbl">Visita</div><div class="cal-bar"><div class="cal-fill cal-fill-r" style="width:${awayC/Math.max(awayG,1)*100}%"><span class="cal-cnt">${awayC}/${awayG}</span></div></div><div class="cal-pct">${(awayC/Math.max(awayG,1)*100).toFixed(0)}%</div></div>
      </div>
      <div class="cal-section">
        <div class="cal-title">Calibraci\u00f3n de probabilidades <span style="font-weight:400;font-size:10px;color:var(--ink3)">(grupos)</span></div>
        <p style="font-size:11px;color:var(--ink3);margin:0 0 10px;line-height:1.5;">
          <b>\u00bfQu\u00e9 es esto?</b> Cuando el modelo dice &ldquo;40% de probabilidad&rdquo;, \u00bfocurre realmente ~40% de las veces? Cada fila agrupa todos los resultados donde el modelo asign\u00f3 una probabilidad en ese rango, y compara la probabilidad predicha (Pred.) contra la frecuencia real (Real).
          Un modelo bien calibrado tiene barras casi iguales.
        </p>
        ${calRows||'<p style="font-size:11px;color:var(--ink3)">Ingresa m\u00e1s resultados de grupos para ver la calibraci\u00f3n.</p>'}
        <div class="cal-legend">
          <span><span class="leg-dot" style="background:var(--g)"></span>Bien calibrado (\u00b18%)</span>
          <span><span class="leg-dot" style="background:var(--gold)"></span>Subestimado (ocurre m\u00e1s de lo predicho)</span>
          <span><span class="leg-dot" style="background:var(--red)"></span>Sobreestimado (ocurre menos de lo predicho)</span>
        </div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
      <div class="cal-section">
        <div class="cal-title">Accuracy fase eliminatoria (bracket) <span>${koCorrect}/${ko.length}</span></div>
        ${ko.length===0?'<p style="font-size:11px;color:var(--ink3)">Fija ganadores en el Bracket para ver accuracy de eliminatoria.</p>':''}
        ${ko.length>0?`
          <div class="cal-bar-wrap"><div class="cal-lbl">Bracket</div><div class="cal-bar"><div class="cal-fill cal-fill-g" style="width:${koCorrect/Math.max(ko.length,1)*100}%"><span class="cal-cnt">${koCorrect}/${ko.length}</span></div></div><div class="cal-pct">${(koCorrect/Math.max(ko.length,1)*100).toFixed(0)}%</div></div>
        `:''}
      </div>
      <div class="cal-section">
        <div class="cal-title">Marcadores exactos ⭐ <span>${exactScore}/${n} grupos</span></div>
        ${exactScore===0?'<p style="font-size:11px;color:var(--ink3)">Aún no hay aciertos de marcador exacto.</p>':exactMatchRows}
      </div>
    </div>
    <div class="cal-section">
      <div class="cal-title">Detalle partido a partido <span>${correctAll} correctos &middot; ${nAll-correctAll} incorrectos</span></div>
      <div class="match-list">${matchRows}</div>
    </div>
  </div>`;
}

// ── COMO ──
function renderC(){
  document.getElementById("app").innerHTML=`<div class="view">
    <div class="lead"><h2>C\u00f3mo funciona</h2></div>
    <div class="howcard">
      <div class="step"><div class="sn">1</div><div><div class="step-t">Probabilidades por fase</div>
        <div class="step-d">En grupos se usa primero <code>SP_GS</code>, que viene del CSV de quiniela. En eliminatorias se usa primero <code>match_proba_cache</code>, con los cruces posibles del modelo.</div></div></div>
      <div class="step"><div class="sn">2</div><div><div class="step-t">Marcadores proyectados</div>
        <div class="step-d">El marcador predicho de grupos viene de <code>PRED_GS</code>: calculado una sola vez desde las &lambda; de ataque/defensa y las probabilidades base del modelo (inmutable, no cambia con ELO). Ahora siempre verás la misma predicción antes y después de ingresar resultados. En cruces del bracket se usa Poisson ajustado.</div></div></div>
      <div class="step"><div class="sn">3</div><div><div class="step-t">Bracket oficial FIFA 2026</div>
        <div class="step-d">16 slots exactos del CSV oficial. Los "Best 3rd" siguen el ranking FIFA de terceros. ELO dinámico ajustado por resultados reales.</div></div></div>
      <div class="step"><div class="sn">4</div><div><div class="step-t">5&thinsp;000 simulaciones Monte Carlo</div>
        <div class="step-d">Cada simulaci\u00f3n completa el torneo entero. Los resultados reales quedan fijos. El % de clasificar = P(aparecer en un slot de 32avos).</div></div></div>
      <div class="step"><div class="sn">5</div><div><div class="step-t">Accuracy en tiempo real</div>
        <div class="step-d">La pesta\u00f1a Accuracy se calcula sola con los resultados que ingresas: aciertos, Brier score, log-loss y calibraci\u00f3n &mdash; tanto de grupos como de los cruces que fijas en el bracket.</div></div></div>
    </div>
  </div>`;
}

let toastT=null;
function toast(m){const t=document.getElementById("toast");t.innerHTML=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2500);}

document.getElementById("resetBtn").onclick=()=>{
  if(!confirm("\u00bfBorrar todos los resultados ingresados?"))return;
  ST={gr:{},ko:{}};elaAdj={};save();recompute();render();toast("\u21BA Todo reiniciado");
};

load();recompute();render();
</script>
